name: Send Jumat reminders

# Every morning (about 08:30 Japan time, with an afternoon catch-up run): emails
# (from the community Gmail account) and LINE messages to whoever is scheduled
# as khatib or imam in the next 7 days - a week-ahead heads-up and a last
# reminder the day before. Each delivery is logged in the database, so
# re-running never sends the same reminder twice. A reminder for a prayer that
# is today is dropped once it is past 11:00 in Japan (see scripts/reminder-lib.mjs).
#
# Run it by hand from the Actions tab to check the setup:
#   - dry_run (default): lists what WOULD be sent; nothing is sent or recorded.
#   - test_email: sends one test email to that address and stops.
on:
  schedule:
    # GitHub starts scheduled jobs late when it is busy, and 00:00 UTC (the top
    # of the hour, and of the day) is its busiest moment: the first run here
    # started 5 h 46 min late. So use quiet minutes, and run twice a day - the
    # second run only sends what the first one missed (every delivery is logged).
    - cron: "23 23 * * *" # 23:23 UTC = 08:23 JST
    - cron: "23 5 * * *" # 05:23 UTC = 14:23 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only list what would be sent (nothing is sent or recorded)"
        type: boolean
        default: true
      test_email:
        description: "Optional: send ONE test email to this address and stop (checks the Gmail secrets)"
        type: string
        required: false

# One run at a time: each delivery is logged right after it is sent.
concurrency:
  group: jumat-reminders
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # GitHub runs scheduled workflows from the repository's default
          # branch. Always run the code from main, so work in progress on
          # another branch can never send real messages.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Unit tests
        run: node --test scripts/reminder-lib.test.mjs

      - name: Send reminders
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # Scheduled runs have no inputs: they always send for real.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email || '' }}
        run: node scripts/send-reminders.mjs
