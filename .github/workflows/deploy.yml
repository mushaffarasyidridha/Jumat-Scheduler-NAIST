name: Deploy to Cloudflare Pages

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The guide page (/guide) lists the pages, tables, jobs and settings straight from
      # the code, so what is published is always current even if someone forgot to run
      # `npm run docs`; the version stamp shows at the bottom of the guide.
      - name: Refresh the guide from the code
        run: |
          node scripts/build-guide.mjs
          printf '{"commit":"%s","date":"%s"}\n' "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%d)" > public/flows/version.json

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply jumat-scheduler-naist-db --remote

      - name: Deploy Pages site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=jumat-scheduler-naist
